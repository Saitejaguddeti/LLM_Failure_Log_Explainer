[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-failure-log-explainer"
version = "0.1.0"
description = "Reads Airflow and Spark failure logs and writes plain-English root-cause notes with an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sai Teja Guddeti" }]
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
bedrock = ["langchain-aws>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
explain-log = "log_explainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # sample log lines are long on purpose
